name: WindowProbe
options:
  deploymentTarget:
    iOS: '18.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    PROBE_DEVICE_FAMILY: '2'
targets:
  WindowProbe:
    type: application
    platform: iOS
    sources:
      - Probe.swift
      - ../../app/MirrorWindowLayout.swift
    info:
      path: ../../build/window-probe/Info.plist
      properties:
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.padphone.windowprobe
        TARGETED_DEVICE_FAMILY: $(PROBE_DEVICE_FAMILY)
  WindowProbeTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WindowTests.swift]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: local.padphone.windowprobe.tests
        TEST_TARGET_NAME: WindowProbe
        TARGETED_DEVICE_FAMILY: '2'
    dependencies:
      - target: WindowProbe
schemes:
  WindowProbe:
    build:
      targets:
        WindowProbe: all
        WindowProbeTests: [test]
    test:
      targets: [WindowProbeTests]
